services:
  ownllm:
    build: .
    image: ownllm:local
    ports:
      - "8787:8787"
    environment:
      # Required: the container binds beyond loopback, so a client api_key is mandatory.
      OWNLLM_API_KEY: ${OWNLLM_API_KEY:?set OWNLLM_API_KEY in your environment}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persist config + OAuth tokens. Run 'ownllm auth login' on the host (Grok needs a
      # browser loopback) and mount the same dir, or 'ownllm config init' inside the volume.
      - ownllm-config:/home/ownllm/.ownllm
    restart: unless-stopped

volumes:
  ownllm-config:
