services:
  ownllm:
    build: .
    image: ownllm:local
    ports:
      - "8787:8787"
    environment:
      # Required: the container binds beyond loopback, so a client api_key is mandatory.
      OWNLLM_API_KEY: ${OWNLLM_API_KEY:?set OWNLLM_API_KEY in your environment}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Persist config + OAuth tokens. Log in straight into the running container with
      #   docker compose exec ownllm ownllm auth login openai-codex
      # (Codex prints a device code; Grok falls back to paste — both work headless). Or log in
      # on the host and mount the same dir here. 'ownllm config init' writes a starter config.
      - ownllm-config:/home/ownllm/.ownllm
    restart: unless-stopped

volumes:
  ownllm-config:
