# ownllm configuration
# Values support ${ENV_VAR} interpolation, resolved at load time.
# An unresolved ${VAR} (env not set) is a hard error.

server:
  host: 127.0.0.1            # non-loopback host requires api_key, or the server refuses to start
  port: 8787
  # api_key: ${OWNLLM_API_KEY}  # client auth (timing-safe); REQUIRED when host is not loopback
  request_timeout_ms: 600000  # upstream abort deadline
  strict_params: false        # true => unsupported params return 400 instead of being ignored

# Fallback circuit breaker (optional; shown with defaults). When a model lists `fallbacks`, a
# failed request is retried on them in order. A model that fails failure_threshold times in a row
# is then skipped for cooldown_ms before it gets another try.
fallback:
  failure_threshold: 3
  cooldown_ms: 30000

providers:
  openai-codex:
    enabled: true
  xai:
    enabled: true
  # Flip to true after `ownllm auth login <provider>` (each is an OAuth subscription login):
  copilot:
    enabled: false            # GitHub Copilot (Chat Completions)
  qwen:
    enabled: false            # Qwen, via your qwen.ai login (Chat Completions)
  minimax:
    enabled: false            # MiniMax (Anthropic Messages API)
  gemini:
    enabled: false            # Google Gemini, via Cloud Code Assist (Gemini API)

# Routing table: requested model name -> upstream provider + model.
# A requested model absent from this table returns 404 (model_not_found).
models:
  gpt-5-codex:
    provider: openai-codex
    upstream: gpt-5-codex
  gpt-5:
    provider: openai-codex
    upstream: gpt-5
    fallbacks: [grok]         # on failure, retry the request on grok (must be a model defined here)
  grok:
    provider: xai
    upstream: grok-build      # Grok Build model names churn; verify with 'ownllm models --remote'
    reasoning_effort: medium
  grok-4:
    provider: xai
    upstream: grok-4.3
  # Routes for the OAuth providers above — enable the provider, then request these model names.
  # Verify live upstream ids with 'ownllm models --remote'.
  copilot-gpt:
    provider: copilot
    upstream: gpt-4.1
  qwen-coder:
    provider: qwen
    upstream: qwen3-coder-plus
  minimax:
    provider: minimax
    upstream: MiniMax-M2
  gemini:
    provider: gemini
    upstream: gemini-2.5-pro
