name: Release

# Single maintainer-gated entry point for cutting a release. It bumps the version,
# tags it, publishes ownllm to npm (OIDC trusted publishing — no tokens), and pushes
# the versioned + :latest images to GHCR. Triggered manually only, so forks and pull
# requests can never run it.
#
# npm trusted publishing is configured against THIS filename (release.yml). Renaming
# the file breaks publishing until the trusted publisher on npmjs.com is updated.
# See docs/RELEASING.md.
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Semver bump
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and validate without publishing or pushing anything
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release:
    name: Bump, publish & tag
    runs-on: ubuntu-latest
    if: github.repository == 'lukaisailovic/ownllm'
    environment: release
    permissions:
      contents: write # bump commit, tag, push, GitHub release
      packages: write # push images to GHCR
      id-token: write # npm OIDC trusted publishing + provenance attestation
      attestations: write # image build provenance
    steps:
      - name: Checkout
        # zizmor: ignore[artipacked] credentials are needed to push the bump commit + tag; this job uploads no artifacts.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node.js
        # zizmor: ignore[cache-poisoning] this release job enables no caching (no setup-node cache, no buildx gha cache), so there is nothing to poison.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The version is read from package.json at runtime (src/meta.ts), so building
      # before the bump is fine — dist carries no embedded version string.
      - name: Lint, typecheck, test & build
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Resolve next version
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          npm version "$RELEASE_TYPE" --no-git-tag-version --no-commit-hooks >/dev/null
          # npm version reserializes package.json with its own formatter; re-apply
          # biome's formatting so the committed bump keeps CI green.
          pnpm exec biome format --write package.json
          version="$(node -p "require('./package.json').version")"
          prerelease=false
          case "$version" in *-*) prerelease=true ;; esac
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "major_minor=${version%.*}"
            echo "prerelease=$prerelease"
            if [ "$prerelease" = true ]; then echo "is_release=false"; else echo "is_release=true"; fi
          } >> "$GITHUB_OUTPUT"

      - name: Preflight — refuse to clobber an existing release
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::git tag ${TAG} already exists"
            exit 1
          fi
          if npm view "ownllm@${VERSION}" version >/dev/null 2>&1; then
            echo "::error::ownllm@${VERSION} is already published to npm"
            exit 1
          fi

      - name: Commit and tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore(release): ownllm ${TAG}"
          git tag -a "${TAG}" -m "ownllm ${VERSION}"

      # Push commit + tag together (atomic) BEFORE publishing, so a blocked push
      # (e.g. branch protection) fails the run before anything is published.
      - name: Push commit and tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
          BRANCH: ${{ github.ref_name }}
        run: git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${TAG}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=${{ steps.version.outputs.major_minor }}
            type=raw,value=latest,enable=${{ steps.version.outputs.is_release }}

      - name: Build and push image
        id: push
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Attest image provenance
        if: ${{ !inputs.dry_run }}
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      # OIDC trusted publishing is an npm-CLI feature requiring npm >= 11.5.1; the version
      # bundled with Node 22 is older. Upgrade first.
      - name: Upgrade npm for OIDC trusted publishing
        if: ${{ !inputs.dry_run }}
        run: npm install --global npm@latest

      # No NPM_TOKEN: npm mints a short-lived token from id-token:write, then publishes
      # the bundled dist with provenance.
      - name: Publish to npm
        if: ${{ !inputs.dry_run }}
        run: pnpm publish --no-git-checks --provenance --access public

      - name: Validate npm package (dry run)
        if: ${{ inputs.dry_run }}
        run: pnpm publish --no-git-checks --dry-run

      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--generate-notes --verify-tag --title "${TAG}")
          if [ "${PRERELEASE}" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release create "${TAG}" "${flags[@]}"
